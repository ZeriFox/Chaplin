name: Apply admin advanced controls

on:
  push:
    branches:
      - feature/admin-advanced-controls
    paths:
      - .github/workflows/apply-admin-upgrade.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-advanced-controls
          fetch-depth: 0

      - name: Apply one-time patches
        run: python3 scripts/apply_admin_upgrade.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Completa prezzi, 2FA, coupon e dati B&B"
          git push origin HEAD:feature/admin-advanced-controls
