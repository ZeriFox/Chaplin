name: Finalize admin advanced controls

on:
  push:
    branches:
      - feature/admin-advanced-controls
    paths:
      - .github/workflows/finalize-admin-controls.yml
      - scripts/finalize_admin_controls.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-advanced-controls
          fetch-depth: 0

      - name: Apply requested changes
        run: python3 scripts/finalize_admin_controls.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Commit and push verified changes
        run: |
          rm -f .github/workflows/finalize-admin-controls.yml
          rm -f scripts/finalize_admin_controls.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Completa tariffe rapide e branding email globale"
          git push origin HEAD:feature/admin-advanced-controls
